<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jin Air 3D Viewer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #9cc9ee; }
    #app { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    #loading {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: white; background: linear-gradient(#79aee0, #d7ecfb);
      font-weight: 700; z-index: 10;
    }
    #info {
      position: absolute; left: 16px; top: 16px; z-index: 5;
      padding: 12px 14px; border-radius: 14px;
      background: rgba(255,255,255,.82); backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      color: #17324d; max-width: 310px;
    }
    #info strong { display:block; font-size: 16px; margin-bottom: 4px; }
    #info span { font-size: 12px; line-height: 1.5; }
    #reset {
      position: absolute; right: 16px; top: 16px; z-index: 5;
      border: 0; border-radius: 12px; padding: 10px 13px;
      background: rgba(255,255,255,.88); color: #17324d;
      font-weight: 700; cursor: pointer; box-shadow: 0 6px 22px rgba(0,0,0,.12);
    }
    #reset:hover { background: white; }
    @media (max-width: 600px) {
      #info { left: 10px; top: 10px; max-width: 250px; }
      #reset { right: 10px; top: 10px; }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="loading">3D 항공기 불러오는 중…</div>
  <div id="info">
    <strong>✈ Jin Air 737 — 3D Viewer</strong>
    <span>마우스/손가락으로 회전 · 휠/핀치로 확대 · 우클릭/두 손가락으로 이동</span>
  </div>
  <button id="reset" type="button">↺ 초기화</button>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

const app = document.getElementById("app");
const loading = document.getElementById("loading");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc9ec);
scene.fog = new THREE.Fog(0x9fc9ec, 120, 260);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 500);
camera.position.set(34, 15, 42);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 14;
controls.maxDistance = 105;
controls.target.set(0, 3, 0);

scene.add(new THREE.HemisphereLight(0xd9efff, 0x55708a, 2.2));

const sun = new THREE.DirectionalLight(0xffffff, 3.2);
sun.position.set(-35, 55, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

const rim = new THREE.DirectionalLight(0xb8dcff, 1.2);
rim.position.set(45, 18, -35);
scene.add(rim);

const aircraft = new THREE.Group();
aircraft.rotation.y = Math.PI / 2;
scene.add(aircraft);

const white = new THREE.MeshStandardMaterial({ color: 0xf7f8f6, roughness: .62, metalness: .04 });
const dark = new THREE.MeshStandardMaterial({ color: 0x23313d, roughness: .7 });
const lime = new THREE.MeshStandardMaterial({ color: 0xd9ee00, roughness: .58 });
const green = new THREE.MeshStandardMaterial({ color: 0x80b800, roughness: .58 });
const glass = new THREE.MeshStandardMaterial({ color: 0x172e3e, roughness: .18, metalness: .25 });
const black = new THREE.MeshStandardMaterial({ color: 0x111315, roughness: .75 });
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x202326, roughness: .9 });
const red = new THREE.MeshStandardMaterial({ color: 0xd92b39, roughness: .5 });

function mesh(geo, mat, pos=[0,0,0], rot=[0,0,0], parent=aircraft) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos); m.rotation.set(...rot);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}

function cylinderBetween(a, b, r, mat, radial=16, parent=aircraft) {
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
  const dir = new THREE.Vector3().subVectors(vb, va);
  const len = dir.length();
  const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, radial), mat);
  c.position.copy(va).add(vb).multiplyScalar(.5);
  c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  c.castShadow = c.receiveShadow = true;
  parent.add(c);
  return c;
}

/* Fuselage: long rounded cylinder, nose and tail tapering */
const fuselage = mesh(
  new THREE.CapsuleGeometry(4.05, 38, 12, 32),
  white,
  [0, 6.2, 0],
  [0,0,Math.PI/2]
);

/* green lower belly stripe */
mesh(new THREE.CapsuleGeometry(4.12, 38.2, 12, 32), green, [0, 6.02, 0], [0,0,Math.PI/2])
  .scale.set(1, .23, 1);

/* bright lime top/side accent strip */
mesh(new THREE.BoxGeometry(39, .52, 7.1), lime, [0, 4.05, 0]);

/* nose cone cover to keep the front white */
mesh(new THREE.SphereGeometry(4.05, 32, 16, 0, Math.PI*2, 0, Math.PI/2.3), white, [-21.1,6.2,0], [0,0,Math.PI/2]);

/* cockpit windows */
for (const z of [-1.65, -0.65, 0.65, 1.65]) {
  const w = mesh(new THREE.BoxGeometry(1.0, .9, .46), glass, [-18.75, 8.2, z], [0,0,0]);
  w.scale.x = 1.0;
}

/* passenger windows */
for (let x = -15.5; x <= 16.2; x += 2.05) {
  for (const z of [-2.42, 2.42]) {
    mesh(new THREE.SphereGeometry(.30, 12, 8), glass, [x, 7.45, z]);
  }
}

/* doors */
for (const x of [-15.0, 14.5]) {
  for (const z of [-2.86, 2.86]) {
    mesh(new THREE.BoxGeometry(1.65, 3.0, .08), dark, [x, 6.55, z]);
    mesh(new THREE.BoxGeometry(1.35, 2.65, .09), white, [x, 6.55, z * 1.005]);
  }
}

/* Wings */
function wing(side) {
  const s = side;
  const shape = new THREE.Shape();
  shape.moveTo(0,0);
  shape.lineTo(24,0);
  shape.lineTo(17,-3.1);
  shape.lineTo(3.5,-6.8);
  shape.lineTo(0,-6.0);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: .34, bevelEnabled: true, bevelSize: .08, bevelThickness: .05 });
  geo.rotateX(Math.PI/2);
  const w = mesh(geo, white, [3, 6.2, s*2.7], [0,0,0]);
  w.scale.z = s;
  return w;
}
wing(1); wing(-1);

/* green/lime wing roots and winglets */
for (const s of [-1,1]) {
  mesh(new THREE.BoxGeometry(15, .18, 1.0), lime, [7, 5.15, s*6.0], [0,0, s*.18]);
  const winglet = mesh(new THREE.BoxGeometry(1.15, 3.1, .3), lime, [20.0, 7.0, s*5.6], [0,0, s*.08]);
}

/* Engines */
function engine(z) {
  const e = new THREE.Group();
  e.position.set(-2.5, 2.65, z);
  aircraft.add(e);

  const nacelle = new THREE.Mesh(new THREE.CylinderGeometry(2.15, 2.0, 6.0, 32), white);
  nacelle.rotation.z = Math.PI/2; nacelle.castShadow = nacelle.receiveShadow = true; e.add(nacelle);

  const intake = new THREE.Mesh(new THREE.TorusGeometry(1.55, .34, 12, 32), dark);
  intake.rotation.z = Math.PI/2; intake.position.x = -3.02; e.add(intake);

  const fan = new THREE.Mesh(new THREE.CylinderGeometry(1.42, 1.42, .22, 24), black);
  fan.rotation.z = Math.PI/2; fan.position.x = -3.12; e.add(fan);

  const spinner = new THREE.Mesh(new THREE.ConeGeometry(.42, .75, 16), white);
  spinner.rotation.z = -Math.PI/2; spinner.position.x = -3.35; e.add(spinner);

  const stripe = new THREE.Mesh(new THREE.BoxGeometry(5.2, .35, 3.7), lime);
  stripe.position.set(.1,-.95,0); e.add(stripe);
}
engine(6.0); engine(-6.0);

/* Tail fin */
const tailShape = new THREE.Shape();
tailShape.moveTo(0,0);
tailShape.lineTo(2.4,0);
tailShape.lineTo(1.2,15.0);
tailShape.lineTo(-1.0,17.2);
tailShape.lineTo(-2.0,2.0);
tailShape.closePath();
const tailGeo = new THREE.ExtrudeGeometry(tailShape, {depth: .55, bevelEnabled:true, bevelSize:.08, bevelThickness:.06});
tailGeo.translate(0,0,-.275);
mesh(tailGeo, lime, [18.0, 7.0, 0]);

/* Tail logo — abstract butterfly-like mark */
for (const s of [-1,1]) {
  mesh(new THREE.SphereGeometry(.75, 16, 12), red, [18.7, 17.1, s*.35]).scale.set(.75,1.25,.42);
  mesh(new THREE.SphereGeometry(.58, 16, 12), new THREE.MeshStandardMaterial({color:0x2d65d5}), [18.7,16.25,s*.85]).scale.set(.85,1.15,.35);
}
mesh(new THREE.SphereGeometry(.32, 12, 8), new THREE.MeshStandardMaterial({color:0x3c3c3c}), [18.7,16.7,0]);

/* Horizontal stabilizers */
for (const s of [-1,1]) {
  const stab = new THREE.Mesh(new THREE.BoxGeometry(7.5, .3, 2.2), white);
  stab.position.set(15.8, 7.2, s*2.1);
  stab.rotation.y = s*.08;
  stab.castShadow = stab.receiveShadow = true;
  aircraft.add(stab);
}

/* Landing gear */
function wheel(x,y,z) {
  const tire = new THREE.Mesh(new THREE.TorusGeometry(.55,.25,12,20), wheelMat);
  tire.position.set(x,y,z);
  tire.rotation.x = Math.PI/2;
  tire.castShadow = true;
  aircraft.add(tire);
}
cylinderBetween([-8, 4.4, 0], [-8, 1.5, 0], .18, dark);
wheel(-8,1.0, .65); wheel(-8,1.0,-.65);
for (const z of [-3.8,3.8]) {
  cylinderBetween([0,3.4,z*.72], [0,1.3,z], .2, dark);
  wheel(0,1.0,z-.55); wheel(0,1.0,z+.55);
}

/* Ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500,500),
  new THREE.MeshStandardMaterial({color:0x78a957, roughness:1})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* Runway */
const runway = new THREE.Mesh(
  new THREE.PlaneGeometry(120,24),
  new THREE.MeshStandardMaterial({color:0x565c60, roughness:.92})
);
runway.rotation.x = -Math.PI/2;
runway.position.y = .012;
scene.add(runway);

for (let x=-55; x<=55; x+=8) {
  const mark = new THREE.Mesh(
    new THREE.BoxGeometry(4, .035, .35),
    new THREE.MeshStandardMaterial({color:0xf4f4f0, roughness:.8})
  );
  mark.position.set(x,.045,0);
  scene.add(mark);
}

/* Distant city blocks for depth */
const city = new THREE.Group();
for (let i=0;i<38;i++) {
  const h = 2 + Math.random()*8;
  const b = new THREE.Mesh(
    new THREE.BoxGeometry(2+Math.random()*5,h,2+Math.random()*4),
    new THREE.MeshStandardMaterial({color:0xc7d1d8,roughness:.9})
  );
  b.position.set(-85 + Math.random()*170, h/2, -32 - Math.random()*12);
  city.add(b);
}
scene.add(city);

/* Camera / controls */
document.getElementById("reset").addEventListener("click", () => {
  camera.position.set(34, 15, 42);
  controls.target.set(0, 3, 0);
  controls.update();
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

loading.style.display = "none";

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
