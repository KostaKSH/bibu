<script>
const duck = document.getElementById('duck');
const game = document.getElementById('game');
let dragging = false;
let pointerOffsetX = 0;

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function startDrag(e) {
  e.preventDefault();
  dragging = true;
  duck.classList.add('dragging');
  const r = duck.getBoundingClientRect();
  pointerOffsetX = e.clientX - r.left;
  duck.setPointerCapture?.(e.pointerId);
}

function moveDrag(e) {
  if (!dragging) return;
  e.preventDefault();
  const r = duck.getBoundingClientRect();
  const maxLeft = game.clientWidth - r.width;
  const newLeft = clamp(e.clientX - pointerOffsetX, 0, maxLeft);
  duck.style.left = newLeft + 'px';
  duck.style.transform = 'none';
}

function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  duck.classList.remove('dragging');
  try { duck.releasePointerCapture?.(e.pointerId); } catch (_) {}
}

duck.addEventListener('pointerdown', startDrag);
duck.addEventListener('pointermove', moveDrag);
duck.addEventListener('pointerup', endDrag);
duck.addEventListener('pointercancel', endDrag);
duck.addEventListener('dragstart', e => e.preventDefault());

// ==============================
// 랜덤 음식/장애물 이모티콘
// ==============================
const foodEmojis = [
  "🍔","🍩","🦟","🌯","🐈","🐤","🐥","🌰","🛺","🍻",
  "🍼","🥟","🍇","🥥","🍣","🍥","🍙","🍫","🍢","🥌",
  "🗿","🖥️","🪤","🧨","🚬","🎴","📣"
];

const fallingFoods = [];
const MAX_FOODS = 5;
let nextFoodSpawn = 0;
let lastFrameTime = performance.now();

function random(min, max) {
  return Math.random() * (max - min) + min;
}

function spawnFood() {
  if (fallingFoods.length >= MAX_FOODS) return;

  const food = document.createElement("div");
  food.className = "falling-food";
  food.textContent = foodEmojis[Math.floor(Math.random() * foodEmojis.length)];

  const size = random(28, 38);
  food.style.fontSize = size + "px";

  const maxX = Math.max(0, game.clientWidth - size - 4);
  const x = random(4, maxX);

  food.style.left = x + "px";
  food.style.top = (-size - 5) + "px";
  game.appendChild(food);

  fallingFoods.push({
    el: food,
    x,
    y: -size - 5,
    speed: random(105, 155),
    size
  });
}

function boxesOverlap(a, b) {
  return !(
    a.right < b.left ||
    a.left > b.right ||
    a.bottom < b.top ||
    a.top > b.bottom
  );
}

function updateFallingFoods(now) {
  const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
  lastFrameTime = now;

  // 다음 생성까지의 시간은 매번 랜덤
  if (now >= nextFoodSpawn) {
    spawnFood();
    nextFoodSpawn = now + random(850, 1650);
  }

  const duckRect = duck.getBoundingClientRect();
  const gameRect = game.getBoundingClientRect();

  for (let i = fallingFoods.length - 1; i >= 0; i--) {
    const item = fallingFoods[i];
    item.y += item.speed * dt;
    item.el.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;

    const foodRect = item.el.getBoundingClientRect();

    // 오리에 닿으면 즉시 사라짐
    if (boxesOverlap(foodRect, duckRect)) {
      item.el.remove();
      fallingFoods.splice(i, 1);
      continue;
    }

    // 화면 맨 아래를 벗어나면 사라짐
    if (foodRect.top > gameRect.bottom) {
      item.el.remove();
      fallingFoods.splice(i, 1);
    }
  }

  requestAnimationFrame(updateFallingFoods);
}

requestAnimationFrame((now) => {
  lastFrameTime = now;
  nextFoodSpawn = now + random(500, 1200);
  requestAnimationFrame(updateFallingFoods);
});

</script>
